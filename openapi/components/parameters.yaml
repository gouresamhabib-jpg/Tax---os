components:
  parameters:
    RequestId:
      name: Request-ID
      in: header
      required: false
      schema:
        type: string
      description: 'Unique request id (UUID) generated by client or API Gateway. Used for tracing.'

    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: 'Correlation id propagated across services for distributed tracing.'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: 'Idempotency key for create/submit endpoints. Server must honor duplicate keys.'

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 500

    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string

    Q:
      name: q
      in: query
      required: false
      schema:
        type: string

    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: 'sort=field:asc,other:desc'
