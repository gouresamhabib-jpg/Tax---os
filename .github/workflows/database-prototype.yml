name: Database prototype checks

on:
  pull_request:
    paths:
      - "Tax - OS/database/prototypes/**"
      - ".github/workflows/database-prototype.yml"
  push:
    branches:
      - '**'
    paths:
      - "Tax - OS/database/prototypes/**"
      - ".github/workflows/database-prototype.yml"

jobs:
  postgres-prototype-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taxos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taxos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: taxos_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create isolated Auth compatibility shim
        run: |
          psql --set ON_ERROR_STOP=1 \
            --file "Tax - OS/database/prototypes/test_support/postgres_auth_stub.sql"

      - name: Apply firm and client prototype
        run: |
          psql --set ON_ERROR_STOP=1 \
            --file "Tax - OS/database/prototypes/20261124_firm_client_registry.sql"

      - name: Apply client assignment and work-item prototype
        run: |
          psql --set ON_ERROR_STOP=1 \
            --file "Tax - OS/database/prototypes/20261124_client_assignments_and_work_items.sql"

      - name: Test firm tenancy and client RLS
        run: |
          psql --set ON_ERROR_STOP=1 \
            --set user_a=11111111-1111-4111-8111-111111111111 \
            --set user_b=22222222-2222-4222-8222-222222222222 \
            --file "Tax - OS/database/prototypes/20261124_firm_client_registry_rls_tests.sql"

      - name: Test client assignments and work-item permissions
        run: |
          psql --set ON_ERROR_STOP=1 \
            --set user_a=11111111-1111-4111-8111-111111111111 \
            --set user_b=22222222-2222-4222-8222-222222222222 \
            --file "Tax - OS/database/prototypes/20261124_client_assignments_and_work_items_rls_tests.sql"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize and start disposable local Supabase
        run: |
          mkdir -p "$RUNNER_TEMP/taxos-supabase"
          cd "$RUNNER_TEMP/taxos-supabase"
          supabase init --force
          supabase start
          eval "$(supabase status -o env)"
          printf 'API_URL=%s\nANON_KEY=%s\nDB_URL=%s\n' \
            "$API_URL" "$ANON_KEY" "$DB_URL" >> "$GITHUB_ENV"

      - name: Create disposable Supabase Auth users
        run: |
          create_user() {
            email="$1"
            password="$2"
            response=$(curl --silent --show-error --write-out '\n%{http_code}' \
              --request POST "$API_URL/auth/v1/signup" \
              --header "apikey: $ANON_KEY" \
              --header "Authorization: Bearer $ANON_KEY" \
              --header "Content-Type: application/json" \
              --data-raw "{\"email\":\"$email\",\"password\":\"$password\"}")
            http_code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "Supabase Auth signup failed with HTTP $http_code:"
              echo "$body"
              return 1
            fi
            echo "$body" | jq -r '.id // .user.id'
          }
          USER_A=$(create_user "taxos-user-a@example.com" "TaxOS-Test-Password-A-2026!")
          USER_B=$(create_user "taxos-user-b@example.com" "TaxOS-Test-Password-B-2026!")
          test -n "$USER_A" && test "$USER_A" != "null"
          test -n "$USER_B" && test "$USER_B" != "null"
          echo "TAXOS_TEST_USER_A=$USER_A" >> "$GITHUB_ENV"
          echo "TAXOS_TEST_USER_B=$USER_B" >> "$GITHUB_ENV"

      - name: Apply prototypes to actual local Supabase
        run: |
          psql "$DB_URL" --set ON_ERROR_STOP=1 \
            --file "Tax - OS/database/prototypes/20261124_firm_client_registry.sql"
          psql "$DB_URL" --set ON_ERROR_STOP=1 \
            --file "Tax - OS/database/prototypes/20261124_client_assignments_and_work_items.sql"

      - name: Run RLS tests against actual local Supabase Auth
        run: |
          psql "$DB_URL" --set ON_ERROR_STOP=1 \
            --set user_a="$TAXOS_TEST_USER_A" \
            --set user_b="$TAXOS_TEST_USER_B" \
            --file "Tax - OS/database/prototypes/20261124_firm_client_registry_rls_tests.sql"
          psql "$DB_URL" --set ON_ERROR_STOP=1 \
            --set user_a="$TAXOS_TEST_USER_A" \
            --set user_b="$TAXOS_TEST_USER_B" \
            --file "Tax - OS/database/prototypes/20261124_client_assignments_and_work_items_rls_tests.sql"

      - name: Stop disposable local Supabase
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/taxos-supabase/supabase/config.toml" ]; then
            cd "$RUNNER_TEMP/taxos-supabase"
            supabase stop --no-backup
          fi
